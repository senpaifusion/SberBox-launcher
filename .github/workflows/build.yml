      - name: Build APK
        working-directory: tvhome
        run: gradle assembleRelease --no-daemon -PvCode=${{ github.run_number }}

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tvhome/app/build/outputs/apk/release/app-release.apk tvhome.apk
          gh release create "v${{ github.run_number }}" tvhome.apk --title "TV Home v${{ github.run_number }}" --notes "APK лаунчера для Android TV"

