          cat > wall.py <<'EOF_W'
          import os, random, math
          from PIL import Image, ImageDraw, ImageFilter, ImageOps

          W, H = 1280, 720
          OUT = 'app/src/main/res/drawable-nodpi/wallpaper.jpg'
          USER = '../wallpaper.jpg'

          def scene():
              S = 2
              w, h = W * S, H * S
              random.seed(7)
              sky = Image.new('RGB', (w, h))
              d = ImageDraw.Draw(sky)
              stops = [(0.0, (10, 12, 46)), (0.45, (58, 38, 112)), (0.75, (214, 98, 140)), (1.0, (255, 176, 130))]
              for y in range(h):
                  t = y / h
                  for i in range(len(stops) - 1):
                      a, ca = stops[i]; b, cb = stops[i + 1]
                      if a <= t <= b:
                          k = (t - a) / (b - a)
                          d.line([(0, y), (w, y)], fill=tuple(int(ca[j] + (cb[j] - ca[j]) * k) for j in range(3)))
                          break
              im = sky.convert('RGBA')
              # stars
              st = Image.new('RGBA', (w, h), (0, 0, 0, 0)); sd = ImageDraw.Draw(st)
              for _ in range(350):
                  x = random.randint(0, w); y = random.randint(0, int(h * 0.55))
                  r = random.choice([1, 1, 2, 3]); a = int(255 * (1 - y / (h * 0.6)))
                  sd.ellipse([x - r, y - r, x + r, y + r], fill=(255, 255, 255, max(60, a)))
              im = Image.alpha_composite(im, st.filter(ImageFilter.GaussianBlur(0.8)))
              # moon + glow
              mx, my, mr = int(w * 0.72), int(h * 0.26), int(h * 0.11)
              glow = Image.new('RGBA', (w, h), (0, 0, 0, 0)); gd = ImageDraw.Draw(glow)
              gd.ellipse([mx - mr * 3, my - mr * 3, mx + mr * 3, my + mr * 3], fill=(255, 220, 240, 70))
              im = Image.alpha_composite(im, glow.filter(ImageFilter.GaussianBlur(mr)))
              md = ImageDraw.Draw(im)
              md.ellipse([mx - mr, my - mr, mx + mr, my + mr], fill=(255, 246, 232, 255))
              # clouds
              cl = Image.new('RGBA', (w, h), (0, 0, 0, 0)); cd = ImageDraw.Draw(cl)
              for _ in range(26):
                  cx = random.randint(-100, w + 100); cy = random.randint(int(h * 0.45), int(h * 0.78))
                  rw = random.randint(180, 480); rh = random.randint(26, 70)
                  cd.ellipse([cx - rw, cy - rh, cx + rw, cy + rh], fill=(255, 190, 210, 70))
              im = Image.alpha_composite(im, cl.filter(ImageFilter.GaussianBlur(28)))
              # mountains
              def ridge(base, amp, col, seed):
                  random.seed(seed)
                  pts = [(0, h)]
                  ph = [random.random() * 6 for _ in range(3)]
                  for x in range(0, w + 20, 20):
                      y = base + amp * (math.sin(x / 260 + ph[0]) * 0.6 + math.sin(x / 110 + ph[1]) * 0.3 + math.sin(x / 47 + ph[2]) * 0.1)
                      pts.append((x, y))
                  pts.append((w, h))
                  l = Image.new('RGBA', (w, h), (0, 0, 0, 0)); ImageDraw.Draw(l).polygon(pts, fill=col)
                  return l.filter(ImageFilter.GaussianBlur(1.5))
              im = Image.alpha_composite(im, ridge(h * 0.70, h * 0.07, (92, 56, 128, 255), 3))
              im = Image.alpha_composite(im, ridge(h * 0.78, h * 0.06, (52, 34, 96, 255), 5))
              # city skyline with lit windows
              cy = Image.new('RGBA', (w, h), (0, 0, 0, 0)); cd = ImageDraw.Draw(cy)
              x = 0
              while x < w:
                  bw = random.randint(40, 110); bh = random.randint(int(h * 0.10), int(h * 0.30))
                  top = h - bh
                  cd.rectangle([x, top, x + bw, h], fill=(16, 14, 38, 255))
                  for wy in range(top + 14, h - 10, 22):
                      for wx in range(x + 8, x + bw - 8, 16):
                          if random.random() < 0.35:
                              cd.rectangle([wx, wy, wx + 6, wy + 9], fill=random.choice([(255, 214, 120, 255), (255, 232, 170, 255), (255, 170, 130, 255)]))
                  x += bw + random.randint(0, 14)
              im = Image.alpha_composite(im, cy)
              # sakura petals
              pt = Image.new('RGBA', (w, h), (0, 0, 0, 0)); pd = ImageDraw.Draw(pt)
              for _ in range(140):
                  x = random.randint(0, w); y = random.randint(0, h)
                  r = random.randint(4, 12)
                  pd.ellipse([x - r, y - r // 2, x + r, y + r // 2], fill=(255, 205, 222, random.randint(110, 230)))
              im = Image.alpha_composite(im, pt.filter(ImageFilter.GaussianBlur(1.2)))
              # blossom branch top-left
              br = Image.new('RGBA', (w, h), (0, 0, 0, 0)); bd = ImageDraw.Draw(br)
              bd.line([(0, int(h * 0.12)), (int(w * 0.14), int(h * 0.06)), (int(w * 0.30), int(h * 0.09))], fill=(40, 24, 50, 255), width=14)
              for _ in range(90):
                  t = random.random(); bx = int(w * 0.30 * t); by = int(h * (0.12 - 0.05 * math.sin(t * 3.0))) + random.randint(-70, 70)
                  r = random.randint(10, 26)
                  bd.ellipse([bx - r, by - r, bx + r, by + r], fill=(255, random.randint(170, 205), random.randint(200, 225), 235))
              im = Image.alpha_composite(im, br.filter(ImageFilter.GaussianBlur(2)))
              return im.convert('RGB').resize((W, H), Image.LANCZOS)

          os.makedirs(os.path.dirname(OUT), exist_ok=True)
          if os.path.exists(USER):
              img = ImageOps.fit(Image.open(USER).convert('RGB'), (W, H), Image.LANCZOS)
          else:
              img = scene()
          img.save(OUT, quality=82, optimize=True)
          print('wallpaper ok', os.path.getsize(OUT))
          EOF_W

          python3 wall.py


      - name: Build APK
        working-directory: tvhome
        run: gradle assembleRelease --no-daemon -PvCode=${{ github.run_number }}

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tvhome/app/build/outputs/apk/release/app-release.apk tvhome.apk
          gh release create "v${{ github.run_number }}" tvhome.apk --title "TV Home v${{ github.run_number }}" --notes "APK лаунчера для Android TV"
