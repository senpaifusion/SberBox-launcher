name: Build TV launcher

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Create project files
        run: |
          mkdir -p tvhome/app/src/main/java/com/my/tvhome
          cd tvhome

          cat > settings.gradle <<'EOF_A'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TvHome"
          include ':app'
          EOF_A

          cat > build.gradle <<'EOF_B'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_B

          cat > app/build.gradle <<'EOF_C'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.my.tvhome'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.my.tvhome'
                  minSdk 21
                  targetSdk 34
                  versionCode Integer.parseInt((project.findProperty('vCode') ?: '1').toString())
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              signingConfigs {
                  release {
                      storeFile file('release.p12')
                      storePassword 'tvhome123'
                      keyAlias 'tvhome'
                      keyPassword 'tvhome123'
                      storeType 'pkcs12'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF_C

          cat > app/src/main/AndroidManifest.xml <<'EOF_D'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="TV Home"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:banner="@drawable/banner"
                      android:icon="@drawable/ic_launcher"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_D

          cat > app/src/main/java/com/my/tvhome/MainActivity.java <<'EOF_E'
          package com.my.tvhome;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextClock;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          public class MainActivity extends Activity {

              // ===== ИЗБРАННЫЕ ПРИЛОЖЕНИЯ (верхний ряд) =====
              // {название, ключевые слова через запятую, пакеты через запятую}
              static final String[][] DOCK = {
                  {"YouTube", "youtube,smarttube",
                      "com.teamsmart.videomanager.tv,com.liskovsoft.smarttubetv.beta,com.google.android.youtube.tv,com.google.android.youtube"},
                  {"Кинопоиск", "кинопоиск,kinopoisk", "ru.kinopoisk.tv,ru.kinopoisk"},
                  {"Happ", "happ", "com.happproxy"},
                  {"AirPlay", "airplay", "io.github.jqssun.airplay"},
                  {"Play Market", "маркет,play store", "com.android.vending"},
              };

              static class App {
                  String label;
                  String pkg;
                  Drawable icon;
                  Intent intent;
                  boolean missing;
              }

              private LinearLayout favRow;
              private LinearLayout grid;
              private ScrollView scroll;
              private TextView shelfTitle;
              private TextView shelfSub;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  buildUi();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  scroll.scrollTo(0, 0);
                  if (favRow.getChildCount() > 0) favRow.getChildAt(0).requestFocus();
              }

              @Override
              public void onBackPressed() {
                  // На главном экране "Назад" ничего не делает
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void buildUi() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  ImageView wp = new ImageView(this);
                  wp.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  try {
                      wp.setImageResource(R.drawable.wallpaper);
                  } catch (Throwable t) {
                      // без обоев остаётся чёрный фон
                  }
                  root.addView(wp, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  View shade = new View(this);
                  shade.setBackground(new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{0x55000000, 0x00000000, 0x99000000, 0xEE000000}));
                  root.addView(shade, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(56), dp(28), dp(56), dp(12));

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.END | Gravity.CENTER_VERTICAL);
                  TextClock date = new TextClock(this);
                  date.setFormat24Hour("EEEE, d MMMM");
                  date.setFormat12Hour("EEEE, d MMMM");
                  date.setTextColor(0xCCFFFFFF);
                  date.setTextSize(18);
                  header.addView(date);
                  TextClock clock = new TextClock(this);
                  clock.setFormat24Hour("HH:mm");
                  clock.setFormat12Hour("HH:mm");
                  clock.setTextColor(Color.WHITE);
                  clock.setTextSize(30);
                  clock.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                  LinearLayout.LayoutParams clockLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  clockLp.leftMargin = dp(18);
                  header.addView(clock, clockLp);
                  content.addView(header);

                  LinearLayout shelf = new LinearLayout(this);
                  shelf.setOrientation(LinearLayout.VERTICAL);
                  shelf.setGravity(Gravity.BOTTOM);
                  shelfTitle = new TextView(this);
                  shelfTitle.setTextColor(Color.WHITE);
                  shelfTitle.setTextSize(48);
                  shelfTitle.setSingleLine(true);
                  shelfTitle.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  shelfTitle.setShadowLayer(dp(10), 0, dp(2), 0x99000000);
                  shelf.addView(shelfTitle);
                  shelfSub = new TextView(this);
                  shelfSub.setTextColor(0xCCFFFFFF);
                  shelfSub.setTextSize(18);
                  shelfSub.setShadowLayer(dp(6), 0, dp(1), 0x99000000);
                  shelf.addView(shelfSub);
                  content.addView(shelf, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  scroll = new ScrollView(this);
                  scroll.setVerticalScrollBarEnabled(false);
                  scroll.setClipToPadding(false);
                  scroll.setPadding(0, dp(14), 0, dp(14));
                  LinearLayout rows = new LinearLayout(this);
                  rows.setOrientation(LinearLayout.VERTICAL);
                  favRow = new LinearLayout(this);
                  favRow.setOrientation(LinearLayout.HORIZONTAL);
                  rows.addView(favRow);
                  grid = new LinearLayout(this);
                  grid.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams gridLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  gridLp.topMargin = dp(18);
                  rows.addView(grid, gridLp);
                  scroll.addView(rows, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  content.addView(scroll, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(330)));

                  root.addView(content, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);
              }

              private void setShelf(App a) {
                  shelfTitle.setText(a.label);
                  shelfSub.setText(a.missing
                          ? "Не установлено. Загрузи APK через apps.sber.ru/my"
                          : "Нажми OK, чтобы открыть");
              }

              private void refresh() {
                  List<App> apps = loadApps();
                  favRow.removeAllViews();
                  grid.removeAllViews();

                  Set<String> used = new HashSet<>();
                  for (String[] d : DOCK) {
                      App a = find(apps, d);
                      if (a == null) {
                          a = new App();
                          a.label = d[0];
                          a.pkg = "missing:" + d[0];
                          a.missing = true;
                      } else {
                          used.add(a.pkg);
                      }
                      favRow.addView(tile(a, 132, 22));
                  }

                  List<App> rest = new ArrayList<>();
                  for (App a : apps) {
                      if (!used.contains(a.pkg)) rest.add(a);
                  }
                  rest.add(settingsApp());

                  int cols = Math.max(4, (getResources().getDisplayMetrics().widthPixels - dp(112)) / dp(104));
                  LinearLayout row = null;
                  for (int i = 0; i < rest.size(); i++) {
                      if (i % cols == 0) {
                          row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          grid.addView(row);
                      }
                      row.addView(tile(rest.get(i), 84, 14));
                  }

                  if (favRow.getChildCount() > 0) favRow.getChildAt(0).requestFocus();
              }

              private App find(List<App> apps, String[] d) {
                  for (String p : d[2].split(",")) {
                      for (App a : apps) {
                          if (a.pkg.equals(p.trim())) return a;
                      }
                  }
                  for (String k : d[1].split(",")) {
                      String key = k.trim().toLowerCase();
                      for (App a : apps) {
                          if (a.label.toLowerCase().contains(key) || a.pkg.toLowerCase().contains(key)) return a;
                      }
                  }
                  return null;
              }

              private List<App> loadApps() {
                  PackageManager pm = getPackageManager();
                  Map<String, App> map = new LinkedHashMap<>();
                  String[] cats = {Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER};
                  for (String cat : cats) {
                      Intent q = new Intent(Intent.ACTION_MAIN).addCategory(cat);
                      for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) {
                          String p = ri.activityInfo.packageName;
                          if (p.equals(getPackageName()) || map.containsKey(p)) continue;
                          App a = new App();
                          a.pkg = p;
                          a.label = String.valueOf(ri.loadLabel(pm));
                          a.icon = ri.loadIcon(pm);
                          a.intent = new Intent(Intent.ACTION_MAIN)
                                  .addCategory(cat)
                                  .setClassName(p, ri.activityInfo.name)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          map.put(p, a);
                      }
                  }
                  List<App> list = new ArrayList<>(map.values());
                  Collections.sort(list, (x, y) -> x.label.compareToIgnoreCase(y.label));
                  return list;
              }

              private App settingsApp() {
                  App a = new App();
                  a.pkg = "settings";
                  a.label = "Настройки";
                  a.icon = getDrawable(android.R.drawable.ic_menu_preferences);
                  a.intent = new Intent(Settings.ACTION_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  return a;
              }

              private GradientDrawable rounded(int color, int stroke, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(radius);
                  if (stroke != 0) g.setStroke(dp(3), stroke);
                  return g;
              }

              private View tile(final App a, int sizeDp, int padDp) {
                  FrameLayout t = new FrameLayout(this);
                  t.setFocusable(true);
                  t.setClickable(true);
                  float r = dp(sizeDp) * 0.22f;
                  final GradientDrawable normal = rounded(0x40FFFFFF, 0, r);
                  final GradientDrawable focused = rounded(0x80FFFFFF, Color.WHITE, r);
                  t.setBackground(normal);
                  t.setAlpha(a.missing ? 0.5f : 1f);

                  if (a.icon != null) {
                      ImageView iv = new ImageView(this);
                      iv.setImageDrawable(a.icon);
                      iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      iv.setPadding(dp(padDp), dp(padDp), dp(padDp), dp(padDp));
                      t.addView(iv, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  } else {
                      TextView letter = new TextView(this);
                      letter.setText(a.label.isEmpty() ? "?" : a.label.substring(0, 1).toUpperCase());
                      letter.setTextColor(Color.WHITE);
                      letter.setTextSize(40);
                      letter.setGravity(Gravity.CENTER);
                      t.addView(letter, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  }

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(sizeDp), dp(sizeDp));
                  lp.setMargins(dp(10), dp(10), dp(10), dp(10));
                  t.setLayoutParams(lp);

                  t.setOnFocusChangeListener((v, f) -> {
                      float s = f ? 1.14f : 1f;
                      v.animate().scaleX(s).scaleY(s).setDuration(140).start();
                      v.setBackground(f ? focused : normal);
                      if (f) setShelf(a);
                  });
                  t.setOnClickListener(v -> launch(a));
                  return t;
              }

              private void launch(App a) {
                  if (a.missing || a.intent == null) {
                      Toast.makeText(this, a.label + " не установлено. Загрузи APK через apps.sber.ru/my",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
                  try {
                      startActivity(a.intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось открыть " + a.label, Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF_E

                    mkdir -p app/src/main/res/drawable

